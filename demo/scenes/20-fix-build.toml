# A real engineering task end to end: reproduce, fix, test, then ask before pushing.
match = ["build", "ci", "failing", "red", "fix the tests", "pr"]
title = "Fix the failing checkout build"
routine = "Nightly repo doctor"
plan = ["Pull main and reproduce the failure", "Find the cause", "Fix it and add a test", "Run the whole suite", "Open a pull request"]
on_steer = "Noted: {message} I'll put it in the same PR."
handover = """## Handover
Repo acme/storefront. CI was red on checkout totals: discounts were rounded per item instead of once per cart. Fixed in src/cart/total.ts with a regression test; suite green (214 passed). PR #482 opened after the owner's yes."""

[[steps]]
do = "think"
text = "Start by reproducing locally; the CI log alone can hide which test fails first."
[[steps]]
do = "plan"
done = 0
[[steps]]
do = "run"
command = "cd ~/code/storefront && git pull --ff-only && pnpm test --filter checkout"
description = "Reproduce the failing checkout tests"
ms = 2600
output = """Already up to date.

 FAIL  src/cart/total.test.ts > cart total > applies a 15% discount once per cart
   AssertionError: expected 2549.15 to equal 2549.16
    ❯ src/cart/total.test.ts:48:31

 Test Files  1 failed | 37 passed (38)
      Tests  1 failed | 213 passed (214)"""
[[steps]]
do = "plan"
done = 1
[[steps]]
do = "read"
path = "src/cart/total.ts"
ms = 700
output = """export function cartTotal(items: Item[], discount = 0): number {
  return items.reduce((sum, item) => {
    const line = item.price * item.qty
    return sum + round2(line * (1 - discount))
  }, 0)
}"""
[[steps]]
do = "think"
text = "The discount is rounded on every line and the rounding errors add up. Apply it once to the subtotal, then round."
[[steps]]
do = "plan"
done = 2
[[steps]]
do = "edit"
path = "src/cart/total.ts"
ms = 900
old = """  return items.reduce((sum, item) => {
    const line = item.price * item.qty
    return sum + round2(line * (1 - discount))
  }, 0)"""
new = """  const subtotal = items.reduce((sum, item) => sum + item.price * item.qty, 0)
  return round2(subtotal * (1 - discount))"""
[[steps]]
do = "plan"
done = 3
[[steps]]
do = "run"
command = "pnpm test && pnpm typecheck"
description = "Run the whole suite and the type check"
ms = 3400
output = """ Test Files  38 passed (38)
      Tests  214 passed (214)
   Duration  11.82s

tsc --noEmit: no errors"""
[[steps]]
do = "usage"
used = 61200
[[steps]]
do = "plan"
done = 4
[[steps]]
do = "ask"
title = "git push origin fix/checkout-rounding && gh pr create --fill"
command = "git switch -c fix/checkout-rounding && git commit -am 'fix(cart): apply the discount once per cart' && git push origin fix/checkout-rounding && gh pr create --fill"
ms = 1600
output = "https://github.com/acme/storefront/pull/482"
rejected = "Okay, nothing pushed. The fix is committed on the local branch fix/checkout-rounding whenever you want it."
[[steps]]
do = "plan"
done = 5
[[steps]]
do = "say"
text = """**Fixed and the PR is up:** [acme/storefront#482](https://github.com/acme/storefront/pull/482)

- **Cause:** the 15% discount was rounded on every line, so a full cart drifted by a paisa.
- **Fix:** apply the discount once to the subtotal, then round (`src/cart/total.ts`).
- **Checks:** all 214 tests pass and the type check is clean. CI is running on the PR now."""

[[routine_steps]]
do = "think"
text = "Nightly check: update, install, run every suite, and only bother the owner if something broke."
[[routine_steps]]
do = "run"
command = "cd ~/code/storefront && git pull --ff-only && pnpm install --frozen-lockfile && pnpm test"
ms = 3000
output = """Updating 3f1c2ad..9b07e41  (6 commits)
Lockfile is up to date, resolution step is skipped

 Test Files  38 passed (38)
      Tests  214 passed (214)"""
[[routine_steps]]
do = "run"
command = "pnpm outdated --long | head -5 && pnpm audit --prod"
ms = 1800
output = """Package     Current  Latest
next        16.2.1   16.2.3
zod         4.1.0    4.1.2

No known vulnerabilities found"""
[[routine_steps]]
do = "say"
text = "**All green tonight.** 6 new commits on main, 214 tests pass, no vulnerabilities. Two patch updates are waiting (next 16.2.3, zod 4.1.2); say the word and I'll open a PR for them."
