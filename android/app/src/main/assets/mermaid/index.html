<!doctype html>
<!--
  Krewd's Mermaid renderer: one hidden WebView (ui/Mermaid.kt) loads this page with network loads blocked, then calls
  krewdRender() for each diagram. It draws the diagram with the bundled mermaid.min.js, paints it on a canvas over
  the block's background and hands back a PNG through the KrewdMermaid bridge. Nothing here reaches the network.
-->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file: 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:">
<style>
  /* Some diagrams (gantt, timeline) size themselves to their container, which in a hidden WebView would be 0 wide. */
  html, body { margin: 0; width: 900px; background: transparent; }
</style>
<script src="mermaid.min.js"></script>
</head>
<body>
<script>
  // Largest picture made: a side of 4096 px and 8 million pixels (32 MB as a bitmap).
  const MAX_SIDE = 4096;
  const MAX_PIXELS = 8000000;
  let serial = 0;

  function reply(id, png, width, height, error) {
    KrewdMermaid.done(id, png || null, width || 0, height || 0, error || null);
  }

  async function krewdRender(id, code, options) {
    const host = document.createElement('div');
    document.body.appendChild(host);
    try {
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        theme: 'base',
        darkMode: options.dark,
        fontFamily: options.font,
        themeVariables: Object.assign({ fontFamily: options.font }, options.vars),
      });
      const { svg } = await mermaid.render('krewd-diagram-' + (++serial), code, host);
      host.innerHTML = svg;
      const el = host.querySelector('svg');
      // The diagram's own size in CSS pixels: its viewBox, else its laid-out box.
      const vb = el.viewBox && el.viewBox.baseVal;
      let w = vb && vb.width ? vb.width : el.getBoundingClientRect().width;
      let h = vb && vb.height ? vb.height : el.getBoundingClientRect().height;
      if (!(w > 0 && h > 0)) throw new Error('The diagram is empty');
      let scale = options.scale;
      scale = Math.min(scale, MAX_SIDE / w, MAX_SIDE / h, Math.sqrt(MAX_PIXELS / (w * h)));
      const pw = Math.max(1, Math.round(w * scale));
      const ph = Math.max(1, Math.round(h * scale));
      el.setAttribute('width', pw);
      el.setAttribute('height', ph);
      el.style.maxWidth = 'none';
      const data = new XMLSerializer().serializeToString(el);
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(data);
      await img.decode();
      const canvas = document.createElement('canvas');
      canvas.width = pw;
      canvas.height = ph;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = options.background;
      ctx.fillRect(0, 0, pw, ph);
      ctx.drawImage(img, 0, 0, pw, ph);
      const png = canvas.toDataURL('image/png');
      reply(id, png.substring(png.indexOf(',') + 1), Math.round(w), Math.round(h), null);
    } catch (e) {
      const message = (e && (e.str || e.message)) || String(e);
      reply(id, null, 0, 0, message);
    } finally {
      host.remove();
      // mermaid.render leaves its scratch element behind when the diagram has an error.
      document.querySelectorAll('[id^="dkrewd-diagram-"]').forEach((n) => n.remove());
    }
  }
</script>
</body>
</html>
