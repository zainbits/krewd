[project]
name = "krewd-server"
dynamic = ["version"]
description = "Krewd server: runs ACP coding agents on the host and serves the Krewd apps"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "websockets>=13",
    "cronsim>=2.6",
    "cryptography>=44",
    "zeroconf>=0.140",
    "segno>=1.6",
    "numpy>=2.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One version for the server and the app: VERSION at the repo root.
[tool.hatch.version]
path = "../VERSION"
pattern = "^(?P<version>\\S+)"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "../VERSION" }]

[tool.hatch.build.targets.wheel]
packages = ["krewd_server"]
