# Crew engines: any command that speaks the Agent Client Protocol (ACP) on stdin/stdout.
# Copy to ~/.config/crew/engines.toml. The app lists every engine here; "default" is preselected.
default = "claude"

[engines.claude]
name = "Claude Code"
# Standalone adapter from https://github.com/agentclientprotocol/claude-agent-acp (bundles Claude Code).
command = ["~/.local/bin/claude-agent-acp"]
# How this engine is pointed at a gateway from profiles.toml ("claude" or "codex"). Without it the engine
# only runs on its own login.
gateway = "claude"

[engines.claude.env]
# browser-harness attaches to the agents' Brave (crew-browser.service) instead of launching one.
BU_CDP_URL = "http://127.0.0.1:9222"
BH_TELEMETRY = "0"
BH_UPDATE_CHECK = "0"
BH_TAB_MARKER = "0"

